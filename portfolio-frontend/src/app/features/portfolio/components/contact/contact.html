<section id="contact" class="contact-section">
  <div class="contact-container">
    <div class="contact-header">
      <h2>Contact <span class="highlight">Me</span></h2>
     
    </div>

    <div class="contact-content">
      <!-- لوحة معلومات التواصل -->
      <div class="contact-info-panel">
        <div>
          <h3>Let's contact! </h3>
          
        </div>

        <div class="social-links-wrapper">
          <h4>Social Media</h4>
          <div class="social-buttons">
            <a href="https://linkedin.com" target="_blank" class="social-btn linkedin">in</a>
            <a href="https://github.com" target="_blank" class="social-btn github">GH</a>
          </div>
        </div>
      </div>

      <!-- نموذج التواصل -->
      <div class="contact-form-panel">
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
          <div class="form-group">
            <label for="name">Name *</label>
            <input id="name" type="text" formControlName="name" placeholder="Your Name" />
            <span class="error-text" *ngIf="contactForm.get('name')?.touched && contactForm.get('name')?.invalid">
              الرجاء إدخال الاسم (حرفين على الأقل).
            </span>
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input id="email" type="email" formControlName="email" placeholder="Your Email" />
            <span class="error-text" *ngIf="contactForm.get('email')?.touched && contactForm.get('email')?.invalid">
              الرجاء إدخال بريد إلكتروني صحيح.
            </span>
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <input id="subject" type="text" formControlName="subject" placeholder="Subject (Optional)" />
          </div>

          <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" rows="4" formControlName="message" placeholder="Write your message here..."></textarea>
            <span class="error-text" *ngIf="contactForm.get('message')?.touched && contactForm.get('message')?.invalid">
              الرجاء كتابة رسالة تحتوي على 10 أحرف على الأقل.
            </span>
          </div>

          <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
          <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

          <button type="submit" [disabled]="isSubmitting" class="submit-btn">
            <span *ngIf="!isSubmitting">Send Message</span>
            <span *ngIf="isSubmitting">Sending...</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
