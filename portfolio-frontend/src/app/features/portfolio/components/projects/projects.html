<section id="projects" class="projects-container">
  <div class="projects-header">
    <h2>My <span class="highlight">Projects</span></h2>
    <p class="projects-subtitle">A showcase of my latest work and technical projects</p>
  </div>

  <div class="projects-grid">
    <div class="project-card" *ngFor="let project of projects">
      
      <!-- 🖼️ Image Slot -->
      <div class="project-image">
        <img *ngIf="project.imageUrl; else placeholder" [src]="project.imageUrl" [alt]="project.title" style="width: 100%; height: 100%; object-fit: cover;" />
        <ng-template #placeholder>
          <span class="image-placeholder">💻</span>
        </ng-template>
      </div>

      <!-- 📝 Project Info -->
      <div class="project-info">
        <h3>{{ project.title }}</h3>
        <p class="project-desc">{{ project.description }}</p>

        <!-- 🏷️ Tech Stack -->
        <div class="tech-stack" *ngIf="project.technologies">
          <span class="tech-tag" *ngFor="let tech of project.technologies.split(',')">
            {{ tech.trim() }}
          </span>
        </div>

        <!-- 🔗 Project Links -->
        <div class="project-links">
          <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank" class="btn-link btn-github">
            GitHub
          </a>
          <a *ngIf="project.linkedinUrl" [href]="project.linkedinUrl" target="_blank" class="btn-link btn-demo">
            LinkedIn
          </a>
        </div>
      </div>

    </div>
  </div>
</section>
