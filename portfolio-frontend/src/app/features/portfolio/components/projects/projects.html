<section id="projects" class="projects-section">
  <h2 class="section-title">My Projects</h2>

  <div class="projects-grid">
    <div class="project-card" *ngFor="let project of projects">
      
      <!-- 🖼️ صورة المشروع + التاريخ -->
      <div class="project-image">
        <img [src]="project.imageUrl" [alt]="project.title" />
        <span class="project-date" *ngIf="project.dateCompleted">{{ project.dateCompleted }}</span>
      </div>

      <!-- 📝 تفاصيل المشروع -->
      <div class="project-info">
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p>

        <!-- 🏷️ التقنيات المستخدمة -->
        <div class="tech-stack" *ngIf="project.technologies">
          <span class="tech-tag" *ngFor="let tech of project.technologies.split(',')">
            {{ tech.trim() }}
          </span>
        </div>

        <!-- 🔗 الروابط (GitHub & LinkedIn) -->
        <div class="project-links">
          <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank" class="btn-link">
            GitHub
          </a>
          <a *ngIf="project.linkedinUrl" [href]="project.linkedinUrl" target="_blank" class="btn-link">
            LinkedIn
          </a>
        </div>
      </div>

    </div>
  </div>
</section>
