<div class="hero-container" *ngIf="heroData">
  <div class="hero-left">
    <h1 class="hero-title">
      Hello, I'm <span class="highlight">{{ heroData.fullName }}</span>
    </h1>
    <h2 class="hero-subtitle">{{ heroData.title }}</h2>
    <p class="hero-bio">{{ heroData.bio }}</p>

    <!-- زر تحميل الـ CV -->
    <div class="hero-actions" *ngIf="heroData.cvUrl">
      <a [href]="heroData.cvUrl" target="_blank" download class="btn-download">
        Download CV
      </a>
    </div>

    <!-- روابط التواصل -->
    <div class="social-links">
      <a *ngIf="heroData.githubUrl" [href]="heroData.githubUrl" target="_blank">GitHub</a>
      <a *ngIf="heroData.linkedinUrl" [href]="heroData.linkedinUrl" target="_blank">LinkedIn</a>
    </div>
  </div>

  <div class="hero-right" *ngIf="heroData.imageUrl">
    <div class="image-wrapper">
      <div class="image-placeholder">
        <img [src]="heroData.imageUrl" [alt]="heroData.fullName" />
      </div>
    </div>
  </div>
</div>
