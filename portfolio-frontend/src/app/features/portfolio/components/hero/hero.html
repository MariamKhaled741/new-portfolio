<section class="hero-section" *ngIf="profile">
  <div class="hero-content">
    <h1>مرحباً، أنا {{ profile.fullName }}</h1>
    <h2>{{ profile.title }}</h2>
    <p class="bio">{{ profile.bio }}</p>

    <div class="hero-buttons">
      <!-- زر تحميل الـ CV -->
      <a *ngIf="profile.cvUrl" [href]="profile.cvUrl" target="_blank" class="btn btn-primary" download>
        تحميل الـ CV 📄
      </a>
      
      <!-- زر التواصل -->
      <a href="#contact" class="btn btn-secondary">تواصل معي ✉️</a>
    </div>

    <!-- روابط التواصل الاجتماعي -->
    <div class="social-links">
      <a *ngIf="profile.githubUrl" [href]="profile.githubUrl" target="_blank">GitHub</a>
      <a *ngIf="profile.linkedinUrl" [href]="profile.linkedinUrl" target="_blank">LinkedIn</a>
    </div>
  </div>

  <!-- صورة الملف الشخصي -->
  <div class="hero-image" *ngIf="profile.imageUrl">
    <img [src]="profile.imageUrl" [alt]="profile.fullName">
  </div>
</section>
