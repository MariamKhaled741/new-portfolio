<section id="about" class="about-container">
  <div class="about-header">
    <h2>About & <span class="highlight">Education</span></h2>
    
  </div>

  <!-- كروت التعليم من الباك إند -->
  <div class="education-grid" *ngIf="educationList.length > 0">
    <div class="education-card" *ngFor="let edu of educationList">
      <div class="edu-icon">🎓</div>
      
      <div class="edu-details">
        <h3>{{ edu.degree }}</h3>
        <h4>{{ edu.university }}</h4>
        <span class="edu-date">{{ edu.duration }} | {{ edu.location }}</span>

        <!-- قائمة المواد الدراسية -->
        <div class="courses-section" *ngIf="edu.courses && edu.courses.length > 0">
          <h5>Key Coursework:</h5>
          <div class="courses-grid">
            <span class="course-tag" *ngFor="let course of edu.courses">
              {{ course }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
