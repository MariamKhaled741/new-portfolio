<section class="certifications-section">
  <h2>الشهادات (Certifications)</h2>

  <div *ngIf="isLoading" class="loading">جاري تحميل الشهادات...</div>

  <div *ngIf="errorMessage && !isLoading" class="error-msg">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && !errorMessage && certifications.length === 0">
    لا توجد شهادات متاحة حالياً.
  </div>

  <div *ngIf="!isLoading && certifications.length > 0" class="certs-grid">
    <div *ngFor="let cert of certifications" class="cert-card">
      <div class="cert-icon">
        🎓
      </div>
      <div class="cert-details">
        <h3>{{ cert.title }}</h3>
        <p><strong>الجهة:</strong> {{ cert.issuer }}</p>

        <!-- في حال كانت هناك صورة حقيقية نعرضها، وإلا نعرض أيقونة جذابة -->
        <img *ngIf="cert.imageUrl && !cert.imageUrl.includes('placeholder')" [src]="cert.imageUrl" [alt]="cert.title" />

        <small><strong>التاريخ:</strong> {{ cert.issueDate | date:'mediumDate' }}</small>
      </div>
    </div>
  </div>
</section>
