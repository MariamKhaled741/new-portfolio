<section class="certifications-section">
  <h2>الشهادات (Certifications)</h2>

  <div *ngIf="isLoading" class="loading">جاري تحميل الشهادات...</div>

  <div *ngIf="!isLoading" class="certs-grid">
    <div *ngFor="let cert of certifications" class="cert-card">
      <img [src]="cert.imageUrl || 'https://via.placeholder.com/150'" [alt]="cert.title" />
      <h3>{{ cert.title }}</h3>
      <p><strong>الجهة:</strong> {{ cert.issuer }}</p>
      <small><strong>التاريخ:</strong> {{ cert.issueDate | date:'mediumDate' }}</small>
    </div>
  </div>
</section>
