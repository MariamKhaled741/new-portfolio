<section id="certifications" class="certifications-section">
  <div class="certifications-container">
    <div class="certifications-header">
      <h2>Certifications & <span class="highlight">Licenses</span></h2>
      <p class="certifications-subtitle">الشهادات المهنية والدورات المعتمَدة</p>
    </div>

    <div class="certifications-grid">
      <div class="cert-card" *ngFor="let cert of certifications">
        <div class="cert-image" *ngIf="cert.imageUrl">
          <img [src]="cert.imageUrl" [alt]="cert.title" />
        </div>
        <div class="cert-icon" *ngIf="!cert.imageUrl">📜</div>

        <div class="cert-content">
          <span class="cert-date" *ngIf="cert.issueDate">{{ cert.issueDate }}</span>
          <h3>{{ cert.title }}</h3>
          <h4>{{ cert.issuer }}</h4>
          
          <p class="cert-summary" *ngIf="cert.summary">{{ cert.summary }}</p>

          <a *ngIf="cert.linkedinUrl" [href]="cert.linkedinUrl" target="_blank" class="btn-link">
            View Certificate ↗
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
