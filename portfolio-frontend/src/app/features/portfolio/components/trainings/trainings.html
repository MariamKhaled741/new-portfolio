<section class="trainings-section">
  <h2>الدورات التدريبية (Trainings)</h2>

  <div *ngIf="isLoading" class="loading">جاري تحميل البيانات...</div>

  <div *ngIf="errorMessage && !isLoading" class="error-msg">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && !errorMessage && trainings.length === 0">
    لا توجد دورات تدريبية مسجلة حالياً.
  </div>

  <div *ngIf="!isLoading && trainings.length > 0" class="trainings-list">
    <div *ngFor="let item of trainings" class="training-card">
      <div class="training-icon">🎯</div>
      <div class="training-info">
        <h3>{{ item.title }}</h3>
        <p class="provider"><strong>الجهة:</strong> {{ item.provider }}</p>
        <p *ngIf="item.description" class="desc">{{ item.description }}</p>
        <div class="dates" *ngIf="item.startDate">
          <small>{{ item.startDate | date:'mediumDate' }} - {{ item.endDate ? (item.endDate | date:'mediumDate') : 'مستمر' }}</small>
        </div>
      </div>
    </div>
  </div>
</section>
