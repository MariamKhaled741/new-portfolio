<div class="trainings-container">
  <!-- الهيدر الرئيسي للسكشن -->
  <div class="trainings-header">
    <h2>My <span class="highlight">Trainings</span></h2>
    <p class="trainings-subtitle">Courses and training programs I have completed</p>
  </div>

  <!-- 1️⃣ حالة التحميل Loading State -->
  <div *ngIf="isLoading" style="text-align: center; color: #4b5563; font-weight: 500;">
    Loading trainings...
  </div>

  <!-- 2️⃣ قائمة التدريبات القادمة من الداتا بيز -->
  <div *ngIf="!isLoading && trainings && trainings.length > 0" class="trainings-list">
    <div *ngFor="let item of trainings" class="training-card">
      
      <!-- أيقونة الكارت -->

      <!-- محتوى الكارت -->
      <div class="card-content">
        
        <div class="card-meta">
          <h3>{{ item.title }}</h3>
          <span *ngIf="item.startDate || item.endDate" class="training-date">
            {{ item.startDate }} <ng-container *ngIf="item.endDate">- {{ item.endDate }}</ng-container>
          </span>
        </div>

        <!-- جهة التدريب Provider -->
        <h4>{{ item.provider }}</h4>

        <!-- الوصف -->
        <p *ngIf="item.description" class="training-desc">
          {{ item.description }}
        </p>

      </div>
    </div>
  </div>

  <!-- 3️⃣ حالة عدم وجود بيانات -->
  <div *ngIf="!isLoading && (!trainings || trainings.length === 0)" style="text-align: center; color: #4b5563;">
    No training programs added yet.
  </div>
</div>
